<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Admin — Kas Paguyuban</title>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body>
    <div class="mock-banner">
      Mockup login admin ·
      <a href="publik.html" style="color: inherit; text-decoration: underline">← Kembali ke publik</a>
    </div>

    <div class="login-wrap">
      <form class="login-card" action="admin.html" method="get">
        <div class="login-card__logo">KP</div>
        <h1>Masuk Admin</h1>
        <p>Khusus ketua & bendahara paguyuban kelas SAID BIN HARITS.</p>

        <div class="stack">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" class="input" type="text" placeholder="bendahara" value="bendahara" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" class="input" type="password" placeholder="••••••••" value="password" />
          </div>
          <button class="btn btn--primary btn--block" type="submit">Masuk</button>
          <a class="btn btn--ghost btn--block" href="publik.html">← Kembali ke halaman publik</a>
        </div>

        <p class="hint" style="margin-top: 16px; font-size: 12px; color: var(--color-text-muted); text-align: center">
          Mock: klik <strong>Masuk</strong> langsung ke dashboard admin.
        </p>
      </form>
    </div>
  </body>
</html>
